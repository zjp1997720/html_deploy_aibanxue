name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      WORKDIR: /root/html_deploy_aibanxue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install production deps (no scripts)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --omit=dev --no-audit --no-fund --ignore-scripts

      - name: Run lint/tests (skip if none)
        run: |
          npm -v
          node -v
          echo "✅ Environment check complete"

      - name: Archive project files (git archive, exclude untracked)
        run: |
          git status --porcelain
          git archive --format=tar.gz -o release.tar.gz HEAD
          ls -lh release.tar.gz

      - name: Generate version file
        run: |
          set -e
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%FT%TZ)
          BRANCH_NAME=${GITHUB_REF_NAME:-unknown}
          printf '%s\n' '{' \
            "  \"commit\": \"${GITHUB_SHA}\"," \
            "  \"shortCommit\": \"${SHORT_SHA}\"," \
            "  \"branch\": \"${BRANCH_NAME}\"," \
            "  \"buildTime\": \"${BUILD_TIME}\"," \
            "  \"runner\": \"github-actions\"" \
            '}' > version.json
          cat version.json

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "release.tar.gz,version.json"
          target: "/tmp/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -Eeuo pipefail
            echo "==> Connected to server, starting deploy script"
            WORKDIR="/root/html_deploy_aibanxue"
            mkdir -p "$WORKDIR"
            cd "$WORKDIR"

            # 备份当前.env文件
            if [ -f .env ]; then
              cp .env .env.backup
              echo "✅ Backed up .env file"
            fi

            # 在解压前清理旧代码，保留关键目录（避免旧文件残留导致未更新）
            echo "🧹 Cleaning old code (preserving .env, db, sessions, node_modules)"
            find "$WORKDIR" -mindepth 1 -maxdepth 1 \
              -not -name '.env' \
              -not -name 'db' \
              -not -name 'sessions' \
              -not -name 'node_modules' \
              -exec rm -rf {} +

            # 解压新代码（git archive仅包含受管文件，.env不会被覆盖）
            tar -xzf /tmp/release.tar.gz -C "$WORKDIR"
            echo "✅ Extracted new code"

            # 写入版本文件（用于 /version 接口与缓存控制）
            if [ -f /tmp/version.json ]; then
              mv /tmp/version.json "$WORKDIR/version.json"
              echo "✅ Installed version.json"
            fi

            # 恢复.env文件
            if [ -f .env.backup ]; then
              mv .env.backup .env
              echo "✅ Restored .env file"
            fi

            echo "==> Node version on server: $(node -v || echo 'node not found')"

            # 安装/更新依赖（跳过 puppeteer 下载）
            if command -v npm >/dev/null 2>&1; then
              echo "==> Installing production dependencies"
              export PUPPETEER_SKIP_DOWNLOAD=1
              npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund
            else
              echo "❌ npm not found"
              exit 1
            fi
            echo "✅ Updated dependencies"

            # 使用PM2进行零停机重启
            echo "==> Reloading PM2 process: html-go"
            pm2 reload html-go || pm2 restart html-go
            PM2_EXIT=$?
            if [ "$PM2_EXIT" -ne 0 ]; then
              echo "❌ PM2 reload/restart failed with code $PM2_EXIT"
              pm2 logs html-go --lines 80 || true
              exit $PM2_EXIT
            fi
            echo "✅ Reloaded PM2 service"
            
            # 等待应用启动
            echo "==> Waiting for application to start..."
            sleep 10

            # 清理临时文件
            rm -f /tmp/release.tar.gz /tmp/version.json .env.backup

      - name: Verify service health
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -euo pipefail
            echo '=== PM2 Status ==='
            pm2 status html-go || { echo 'PM2 status failed'; exit 1; }
            echo '=== Waiting for app readiness on 127.0.0.1:8888 ==='
            READY=0
            for i in {1..30}; do
              if curl -fsS -m 3 http://127.0.0.1:8888/ -o /dev/null; then
                echo "✅ App is ready (attempt $i)"
                READY=1
                break
              fi
              sleep 2
            done
            if [ "$READY" -ne 1 ]; then
              echo '❌ Health check failed after 30 attempts'
              echo '=== Recent PM2 Logs ==='
              pm2 logs html-go --lines 80 || true
              exit 1
            fi
            echo '=== Deployment Complete ==='
# Nginx 安全片段（可 include 至 server 块）

# 1) 屏蔽敏感文件与目录
location ~* (\.env|/\.git|/\.ht|/\.vscode|/package\.json|/yarn\.lock|/pnpm-lock\.yaml|/composer\.json|/config\.(js|ts))$ {
  return 444;
}

# 2) 显式处理站点图标（避免 404 扫描噪音）
location = /favicon.ico {
  try_files /icon/web/favicon.ico =404;
}

# 3) 关闭不必要的方法（按需启用）
# if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) { return 405; }

# 4) 额外安全头（Helmet 已覆盖，保留以防静态直连）
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;


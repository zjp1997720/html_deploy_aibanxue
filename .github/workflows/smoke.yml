name: production-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "目标站点基础地址(含协议)"
        required: false
        default: "https://htmlshare.aibanxue.top"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.base_url || vars.BASE_URL || 'https://htmlshare.aibanxue.top' }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Show target
        run: |
          echo "BASE_URL=$BASE_URL"
          if [ -z "$AUTH_PASSWORD" ]; then
            echo "::error::缺少 Secrets.AUTH_PASSWORD"; exit 1; fi

      - name: Run smoke script
        run: |
          chmod +x scripts/smoke-e2e.sh
          ./scripts/smoke-e2e.sh
        env:
          BASE_URL: ${{ env.BASE_URL }}
          AUTH_PASSWORD: ${{ env.AUTH_PASSWORD }}

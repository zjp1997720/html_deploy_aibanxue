name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      WORKDIR: /root/html_deploy_aibanxue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run lint/tests (skip if none)
        run: |
          npm -v
          node -v
          echo "✅ Environment check complete"

      - name: Archive project files (git archive, exclude untracked)
        run: |
          git status --porcelain
          git archive --format=tar.gz -o release.tar.gz HEAD
          ls -lh release.tar.gz

      - name: Generate version file
        run: |
          set -e
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%FT%TZ)
          BRANCH_NAME=${GITHUB_REF_NAME:-unknown}
          printf '%s\n' '{' \
            "  \"commit\": \"${GITHUB_SHA}\"," \
            "  \"shortCommit\": \"${SHORT_SHA}\"," \
            "  \"branch\": \"${BRANCH_NAME}\"," \
            "  \"buildTime\": \"${BUILD_TIME}\"," \
            "  \"runner\": \"github-actions\"" \
            '}' > version.json
          cat version.json

      - name: Copy files to server via sshpass+scp
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no release.tar.gz $SERVER_USER@$SERVER_HOST:/tmp/release.tar.gz
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no version.json $SERVER_USER@$SERVER_HOST:/tmp/version.json

      - name: Remote deploy via SSH (PM2)
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
          set -e
          WORKDIR="/root/html_deploy_aibanxue"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          # 备份当前.env文件
          if [ -f .env ]; then
            cp .env .env.backup
            echo "✅ Backed up .env file"
          fi

          # 在解压前清理旧代码，保留关键目录（避免旧文件残留导致未更新）
          echo "🧹 Cleaning old code (preserving .env, db, sessions, node_modules)"
          find "$WORKDIR" -mindepth 1 -maxdepth 1 \
            -not -name '.env' \
            -not -name 'db' \
            -not -name 'sessions' \
            -not -name 'node_modules' \
            -exec rm -rf {} +

          # 解压新代码（git archive仅包含受管文件，.env不会被覆盖）
          tar -xzf /tmp/release.tar.gz -C "$WORKDIR"
          echo "✅ Extracted new code"

          # 写入版本文件（用于 /version 接口与缓存控制）
          if [ -f /tmp/version.json ]; then
            mv /tmp/version.json "$WORKDIR/version.json"
            echo "✅ Installed version.json"
          fi

          # 恢复.env文件
          if [ -f .env.backup ]; then
            mv .env.backup .env
            echo "✅ Restored .env file"
          fi

          # 安装/更新依赖
          if command -v npm >/dev/null 2>&1; then
            npm ci --omit=dev || npm install --production
          else
            echo "❌ npm not found"
            exit 1
          fi
          echo "✅ Updated dependencies"

          # 使用PM2进行零停机重启
          pm2 reload html-go || pm2 restart html-go
          echo "✅ Reloaded PM2 service"

          # 清理临时文件
          rm -f /tmp/release.tar.gz .env.backup
          EOF

      - name: Verify service health
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
          set -euo pipefail
          echo '=== PM2 Status ==='
          pm2 status html-go || { echo 'PM2 status failed'; exit 1; }
          echo '=== Waiting for app readiness on 127.0.0.1:8888 ==='
          READY=0
          for i in {1..30}; do
            if curl -fsS -m 3 http://127.0.0.1:8888/ -o /dev/null; then
              echo "✅ App is ready (attempt $i)"
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo '❌ Health check failed after 30 attempts'
            echo '=== Recent PM2 Logs ==='
            pm2 logs html-go --lines 80 || true
            exit 1
          fi
          echo '=== Deployment Complete ==='
          EOF
